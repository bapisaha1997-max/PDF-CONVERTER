<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Translator | English to Bengali</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>PDF <span class="gradient-text">Translator</span></h1>
            <p class="subtitle">Extract English from Hindi-mixed PDFs and translate to Bengali using Groq AI</p>
        </header>

        <!-- Initial Upload View -->
        <section class="upload-section" id="upload-section">
            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 10V9C7 6.23858 9.23858 4 12 4C14.7614 4 17 6.23858 17 9V10C19.2091 10 21 11.7909 21 14C21 16.2091 19.2091 18 17 18H7C4.79086 18 3 16.2091 3 14C3 11.7909 4.79086 10 7 10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 12V21M12 12L15 15M12 12L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <p>Drag & Drop your PDF here or <span class="browse-link">Browse Files</span></p>
                    <p class="file-limit">Supports .pdf files only</p>
                    <input type="file" id="file-input" accept=".pdf" hidden>
                </div>
            </div>
            
            <div id="file-ready" class="file-ready hidden">
                <div class="file-card saas-card">
                    <span id="filename">document_name.pdf</span>
                    <button id="start-btn" class="primary-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                        Start Processing
                    </button>
                </div>
            </div>
        </section>

        <!-- Split Screen Editor (Hidden by default) -->
        <main class="editor-view hidden" id="editor-view">
            <div class="split-container">
                <div class="editor-pane">
                    <div class="pane-header">
                        <h3>English Text</h3>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <button class="clear-btn" onclick="copyText('english-text-area', this)">Copy</button>
                            <button class="clear-btn" onclick="clearAll()">Clear All</button>
                            <span class="badge">Extracted</span>
                        </div>
                    </div>
                    <textarea id="english-text-area" spellcheck="false" placeholder="Extracted text will appear here..."></textarea>
                    
                    <div class="action-footer" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px;">
                        <div class="engine-selector">
                            <label for="ai-engine" style="font-size: 0.9rem; color: var(--text-dim);">AI Engine:</label>
                            <select id="ai-engine" class="solid-select">
                                <option value="groq">Groq (Llama 3 70B)</option>
                            </select>
                        </div>
                        <button id="translate-btn" class="glow-cyan" style="width: auto; margin: 0; padding: 0.7rem 1.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">AI Translate to Bengali</button>
                    </div>
                </div>

                <div class="editor-pane">
                    <div class="pane-header">
                        <h3>Bengali Translation</h3>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <button class="clear-btn" onclick="copyText('bengali-text-area', this)">Copy</button>
                            <span class="badge highlight">Bengali Unicode</span>
                        </div>
                    </div>
                    <textarea id="bengali-text-area" dir="ltr" spellcheck="false" placeholder="Translation will appear here..."></textarea>
                        <button id="generate-btn" class="action-btn glow-purple">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Preview & Save PDF
                    </button>
                    <button id="replace-hindi-btn" class="action-btn plain-btn" style="margin-top: 10px;">
                        Replace Hindi in Original PDF
                    </button>
                </div>
            </div>
        </main>
 
        <!-- PDF Preview Modal -->
        <div id="pdf-modal" class="modal-overlay hidden">
            <div class="modal-container">
                <div class="modal-header">
                    <h2>PDF Preview</h2>
                    <button id="close-modal" class="close-btn">&times;</button>
                </div>
                <div class="pdf-viewer">
                    <iframe id="pdf-frame"></iframe>
                </div>
                <div class="modal-footer">
                    <div class="layout-selector">
                        <label for="pdf-layout" style="font-size: 0.8rem; color: var(--text-dim);">Layout:</label>
                        <select id="pdf-layout" class="solid-select" style="font-size: 0.8rem; padding: 0.2rem 0.5rem;">
                            <option value="side-by-side">Side-by-Side (Bilingual)</option>
                            <option value="standard">Standard (Bengali First)</option>
                        </select>
                    </div>
                    <div class="modal-actions" style="margin-left: auto; display: flex; gap: 10px;">
                        <button id="download-btn" class="primary-btn glow-cyan" style="padding: 0.5rem 1rem;">Download</button>
                        <button id="refresh-preview" class="action-btn plain-btn" style="padding: 0.5rem 1rem;">Refresh</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loader Overlay -->
        <div id="loader" class="loader-overlay hidden">
            <div class="loader-content">
                <div class="spinner"></div>
                <p id="loader-msg">Cleaning Hindi characters...</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}?v=2"></script>
</body>
</html>
